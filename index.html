<!DOCTYPE html>
<html lang="en">
<head>
     <!-- this allows for the website to be responsive on all devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- browser tab name -->
  <title>What's on Your Plate?</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header (includes navigation) -->
    <header>
      <nav>
        <a href="#home">Home</a>
        <a href="#recipes">Recipes</a>
        <a href="#diary">Your Diary</a>
      </nav>
    </header>

    <!-- Main content of the webpage -->
     <main>

    <!-- HOME SECTION -->
    <section id="home">
      <h1 class="plate-title">
  <span>w</span><span>h</span><span>a</span><span>t</span><span>'</span><span>s</span>
  <span> </span>
  <span>o</span><span>n</span>
  <span> </span>
  <span>y</span><span>o</span><span>u</span><span>r</span>
  <span> </span>
  <span>p</span><span>l</span><span>a</span><span>t</span><span>e</span><span>?</span>
</h1>
      <p>Find your next meal.</p>

     <button id="see-recipes-btn">See Recipes</button>

</section>

      <!-- RECIPE RESULTS SECTION -->
   <section id="recipes">
  <div class="results-header-title">
    <h1>decolonize your mind, one dish at a time.</h1>
    <h2>here are your results; let’s cook.</h2>
  </div>

  <div id="recipe-container">
    <!-- JavaScript will insert recipe cards here -->
  </div>


</section>
    
           <!-- RECIPE DIARY SECTION -->
    <section id="diary">
      <h1>Your Diary</h1>
      <p>Your saved recipes will appear here.</p>
      <div id="diary-container"></div>
    </section>

  </main>
  <script src="script.js"></script>
  <script>
    // Simple hash router: show only the section that matches the URL hash.
    (function () {
      function showSection(id) {
        // hide all sections
        document.querySelectorAll('main section').forEach(function (sec) {
          sec.style.display = 'none';
        });

        // default to #home when no hash provided
        if (!id) id = '#home';

        var target = document.querySelector(id);
        if (target) target.style.display = 'block';
      }

      // show on initial load
      showSection(location.hash);

      // respond to hash changes
      window.addEventListener('hashchange', function () {
        showSection(location.hash);
      });
    })();
  </script>
  </body>
</html>
