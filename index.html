<!DOCTYPE html>
<html lang="en">
<head>
     <!-- this allows for the website to be responsive on all devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- browser tab name -->
  <title>What's on Your Plate?</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header (includes navigation) -->
    <header>
      <nav>
        <a href="#home">Home</a>
        <a href="#recipes">Recipes</a>
        <a href="#diary">Your Diary</a>
      </nav>
    </header>

    <!-- Main content of the webpage -->
     <main>

    <!-- HOME SECTION -->
    <section id="home">
      <h2>What's on your plate?</h2>
      <p>Find your next meal.</p>
    </section>

      <!-- RECIPE RESULTS SECTION -->
   <section id="recipes">
  <div class="Results header title">
    <h1>decolonize your mind, one dish at a time.</h1>
    <h2>here are your results.</h2>
    <h2>let’s cook.</h2>
  </div>

  <div id="recipe-container">
    <!-- JavaScript will insert recipe cards here -->
  </div>
</section>
    
           <!-- RECIPE DIARY SECTION -->
    <section id="diary">
      <h1>Your Diary</h1>
      <p>Your saved recipes will appear here.</p>
    </section>

  </main>
  <script src="script.js"></script>
  <script>
    // Simple hash router: show only the section that matches the URL hash.
    (function () {
      function showSection(id) {
        // hide all sections
        document.querySelectorAll('main section').forEach(function (sec) {
          sec.style.display = 'none';
        });

        // default to #home when no hash provided
        if (!id) id = '#home';

        var target = document.querySelector(id);
        if (target) target.style.display = 'block';
      }

      // show on initial load
      showSection(location.hash);

      // respond to hash changes
      window.addEventListener('hashchange', function () {
        showSection(location.hash);
      });
    })();
  </script>
  </body>
</html>
